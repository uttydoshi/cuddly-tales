<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-label="Sequence: Angular loads the child profile and characters, posts a new story (FastAPI checks the daily cap), and opens an EventSource stream. FastAPI on Lambda reads token chunks from LiteLLM and sends one word event per word. Then it sends a checking event and asks the model, as a judge, for a structured verdict; if the story fails, it sends a rewriting event, streams a rewrite and checks again, once. It saves the text with the safety result to Neon Postgres and sends a done event.">
          <style>svg{--bg:#ffffff;--fg:#1b2230;--muted:#5d6676;--line-strong:#8a93a3;--accent:#b86e0a;--accent-soft:#fbefd9;--accent-ink:#8a5207;--surface:#ffffff}@media (prefers-color-scheme: dark){svg{--bg:#18202c;--fg:#e4e8ef;--muted:#98a2b3;--line-strong:#5b6678;--accent:#f2b35a;--accent-soft:#2d2416;--accent-ink:#f2b35a;--surface:#18202c}}svg{--font-head:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--font-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}.bg{fill:var(--bg)}/* SVG parts, styled from the page so both themes work */
.frame { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.25; }
.box-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
.box-later { fill: none; stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 5 4; }
.loop { fill: none; stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.t { fill: var(--fg); font: 600 13px var(--font-head); }
.t-later { fill: var(--muted); font: 600 13px var(--font-head); }
.s { fill: var(--muted); font: 11px var(--font-mono); }
.lbl { fill: var(--fg); font: 11.5px var(--font-mono); }
.lbl-acc { fill: var(--accent-ink); font: 500 11.5px var(--font-mono); }
.lbl-later { fill: var(--muted); font: 11.5px var(--font-mono); }
.ln { stroke: var(--fg); stroke-width: 1.4; fill: none; }
.ln-acc { stroke: var(--accent); stroke-width: 2.2; fill: none; }
.ln-later { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
.ret { stroke-dasharray: 4 3; }
.life { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2 4; }
.ah { fill: var(--fg); }
.ah-acc { fill: var(--accent); }
.ah-later { fill: var(--muted); }
</style>
          <rect class="bg" width="1000" height="690" rx="12"/>
          <defs>
            <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
            <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-acc"/></marker>
          </defs>

          <!-- Lifelines -->
          <rect class="box" x="40" y="16" width="160" height="40" rx="6"/>
          <text class="t" x="120" y="41" text-anchor="middle">Angular</text>
          <rect class="box" x="320" y="16" width="160" height="40" rx="6"/>
          <text class="t" x="400" y="41" text-anchor="middle">FastAPI on Lambda</text>
          <rect class="box" x="590" y="16" width="180" height="40" rx="6"/>
          <text class="t" x="680" y="41" text-anchor="middle">LiteLLM → Anthropic</text>
          <rect class="box" x="810" y="16" width="160" height="40" rx="6"/>
          <text class="t" x="890" y="41" text-anchor="middle">Neon Postgres</text>
          <line class="life" x1="120" y1="56" x2="120" y2="676"/>
          <line class="life" x1="400" y1="56" x2="400" y2="676"/>
          <line class="life" x1="680" y1="56" x2="680" y2="676"/>
          <line class="life" x1="890" y1="56" x2="890" y2="676"/>

          <!-- 1 load -->
          <line class="ln" x1="120" y1="96" x2="398" y2="96" marker-end="url(#b1)"/>
          <text class="lbl" x="260" y="89" text-anchor="middle">1  GET /api/profile, /api/characters</text>
          <line class="ln" x1="400" y1="120" x2="888" y2="120" marker-end="url(#b1)"/>
          <text class="lbl" x="645" y="113" text-anchor="middle">select child + cast</text>
          <line class="ln ret" x1="400" y1="144" x2="122" y2="144" marker-end="url(#b1)"/>
          <text class="lbl" x="260" y="137" text-anchor="middle">Mira + her cast</text>

          <!-- 2 create -->
          <line class="ln" x1="120" y1="196" x2="398" y2="196" marker-end="url(#b1)"/>
          <text class="lbl" x="260" y="189" text-anchor="middle">2  POST /api/stories {character_ids}</text>
          <line class="ln" x1="400" y1="220" x2="888" y2="220" marker-end="url(#b1)"/>
          <text class="lbl" x="645" y="213" text-anchor="middle">check daily cap · insert Story (planned)</text>
          <line class="ln ret" x1="400" y1="244" x2="122" y2="244" marker-end="url(#b1)"/>
          <text class="lbl" x="260" y="237" text-anchor="middle">201 {id}</text>

          <!-- 3 stream -->
          <line class="ln-acc" x1="120" y1="296" x2="398" y2="296" marker-end="url(#b2)"/>
          <text class="lbl-acc" x="260" y="289" text-anchor="middle">3  GET /api/stories/{id}/stream</text>
          <line class="ln" x1="400" y1="320" x2="678" y2="320" marker-end="url(#b1)"/>
          <text class="lbl" x="540" y="313" text-anchor="middle">prompt: cast, rules, stories told</text>
          <rect class="loop" x="40" y="336" width="740" height="92" rx="6"/>
          <text class="s" x="50" y="353">loop · each chunk (keep-alive comment if quiet for 15s)</text>
          <line class="ln-acc ret" x1="680" y1="374" x2="402" y2="374" marker-end="url(#b2)"/>
          <text class="lbl-acc" x="540" y="367" text-anchor="middle">delta text</text>
          <line class="ln-acc" x1="400" y1="408" x2="122" y2="408" marker-end="url(#b2)"/>
          <text class="lbl-acc" x="260" y="401" text-anchor="middle">event: word</text>

          <!-- 4 check -->
          <line class="ln-acc" x1="400" y1="460" x2="122" y2="460" marker-end="url(#b2)"/>
          <text class="lbl-acc" x="260" y="453" text-anchor="middle">4  event: checking</text>
          <line class="ln" x1="400" y1="484" x2="678" y2="484" marker-end="url(#b1)"/>
          <text class="lbl" x="540" y="477" text-anchor="middle">judge: structured verdict</text>
          <line class="ln ret" x1="680" y1="508" x2="402" y2="508" marker-end="url(#b1)"/>
          <text class="lbl" x="540" y="501" text-anchor="middle">scariness · rules · new?</text>
          <rect class="loop" x="40" y="522" width="740" height="46" rx="6"/>
          <text class="s" x="50" y="539">if it fails, once: event: rewriting, stream the rewrite, check again</text>
          <text class="s" x="50" y="556">still fails, or the check can't run: saved as "Read first"</text>

          <!-- 5 save -->
          <line class="ln" x1="400" y1="600" x2="888" y2="600" marker-end="url(#b1)"/>
          <text class="lbl" x="645" y="593" text-anchor="middle">update text · written · safety result</text>
          <line class="ln-acc" x1="400" y1="628" x2="122" y2="628" marker-end="url(#b2)"/>
          <text class="lbl-acc" x="260" y="621" text-anchor="middle">5  event: done {id, safety}</text>

          <!-- 6 view -->
          <line class="ln" x1="120" y1="666" x2="398" y2="666" marker-end="url(#b1)"/>
          <text class="lbl" x="260" y="659" text-anchor="middle">6  GET /api/stories/{id} · read in pages</text>
        </svg>
