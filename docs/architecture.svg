<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Architecture: the Angular app in the browser talks to one FastAPI service over JSON and Server-Sent Events. FastAPI serves the built Angular files, stores data through SQLModel in SQLite, and calls the Anthropic API through LiteLLM with streaming. Postgres, Langfuse and APScheduler are later additions.">
          <style>svg{--bg:#ffffff;--fg:#1b2230;--muted:#5d6676;--line-strong:#8a93a3;--accent:#b86e0a;--accent-soft:#fbefd9;--accent-ink:#8a5207;--surface:#ffffff}@media (prefers-color-scheme: dark){svg{--bg:#18202c;--fg:#e4e8ef;--muted:#98a2b3;--line-strong:#5b6678;--accent:#f2b35a;--accent-soft:#2d2416;--accent-ink:#f2b35a;--surface:#18202c}}svg{--font-head:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--font-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}.bg{fill:var(--bg)}.frame { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.25; }
.box-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
.box-later { fill: none; stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 5 4; }
.loop { fill: none; stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.t { fill: var(--fg); font: 600 13px var(--font-head); }
.t-later { fill: var(--muted); font: 600 13px var(--font-head); }
.s { fill: var(--muted); font: 11px var(--font-mono); }
.lbl { fill: var(--fg); font: 11.5px var(--font-mono); }
.lbl-acc { fill: var(--accent-ink); font: 500 11.5px var(--font-mono); }
.lbl-later { fill: var(--muted); font: 11.5px var(--font-mono); }
.ln { stroke: var(--fg); stroke-width: 1.4; fill: none; }
.ln-acc { stroke: var(--accent); stroke-width: 2.2; fill: none; }
.ln-later { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
.ret { stroke-dasharray: 4 3; }
.life { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2 4; }
.ah { fill: var(--fg); }
.ah-acc { fill: var(--accent); }
.ah-later { fill: var(--muted); }</style><rect class="bg" width="1000" height="480" rx="12"/><defs>
            <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
            <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-acc"/></marker>
            <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-later"/></marker>
          </defs>

          <!-- Browser -->
          <rect class="frame" x="20" y="40" width="200" height="290" rx="10"/>
          <text class="t" x="36" y="66">Browser</text>
          <text class="s" x="36" y="82">Angular SPA</text>
          <rect class="box" x="36" y="100" width="168" height="48" rx="6"/>
          <text class="t" x="48" y="120">Story list</text>
          <text class="s" x="48" y="137">/stories</text>
          <rect class="box" x="36" y="160" width="168" height="48" rx="6"/>
          <text class="t" x="48" y="180">Read a story</text>
          <text class="s" x="48" y="197">/stories/:id</text>
          <rect class="box-acc" x="36" y="240" width="168" height="56" rx="6"/>
          <text class="t" x="48" y="262">Pick + watch it stream</text>
          <text class="s" x="48" y="280">/new · EventSource</text>

          <!-- FastAPI -->
          <rect class="frame" x="290" y="20" width="440" height="440" rx="10"/>
          <text class="t" x="306" y="46">FastAPI</text>
          <text class="s" x="306" y="62">one service · uvicorn</text>
          <rect class="box" x="320" y="70" width="190" height="48" rx="6"/>
          <text class="t" x="332" y="90">Static files</text>
          <text class="s" x="332" y="107">frontend/dist</text>
          <rect class="box" x="320" y="144" width="190" height="48" rx="6"/>
          <text class="t" x="332" y="164">API routers</text>
          <text class="s" x="332" y="181">/api/*  REST</text>
          <rect class="box-acc" x="320" y="240" width="190" height="56" rx="6"/>
          <text class="t" x="332" y="262">Story service</text>
          <text class="s" x="332" y="280">prompt · words · save</text>
          <rect class="box" x="320" y="340" width="190" height="48" rx="6"/>
          <text class="t" x="332" y="360">llm.py</text>
          <text class="s" x="332" y="377">LiteLLM acompletion</text>
          <rect class="box-later" x="560" y="70" width="150" height="48" rx="6"/>
          <text class="t-later" x="572" y="90">APScheduler</text>
          <text class="s" x="572" y="107">Day 3</text>
          <rect class="box" x="560" y="190" width="150" height="48" rx="6"/>
          <text class="t" x="572" y="210">SQLModel</text>
          <text class="s" x="572" y="227">tables · session</text>

          <!-- Outside services -->
          <rect class="box-later" x="800" y="110" width="180" height="48" rx="6"/>
          <text class="t-later" x="812" y="130">Postgres</text>
          <text class="s" x="812" y="147">prod · DATABASE_URL</text>
          <rect class="box" x="800" y="190" width="180" height="48" rx="6"/>
          <text class="t" x="812" y="210">SQLite</text>
          <text class="s" x="812" y="227">cuddly_tales.db</text>
          <rect class="box-acc" x="800" y="340" width="180" height="48" rx="6"/>
          <text class="t" x="812" y="360">Anthropic API</text>
          <text class="s" x="812" y="377">claude-opus-5-5</text>
          <rect class="box-later" x="800" y="410" width="180" height="48" rx="6"/>
          <text class="t-later" x="812" y="430">Langfuse</text>
          <text class="s" x="812" y="447">traces · Day 2</text>

          <!-- Browser <-> FastAPI -->
          <line class="ln" x1="220" y1="94" x2="320" y2="94" marker-end="url(#a1)"/>
          <text class="lbl" x="255" y="87" text-anchor="middle">app shell</text>
          <line class="ln" x1="220" y1="168" x2="320" y2="168" marker-start="url(#a1)" marker-end="url(#a1)"/>
          <text class="lbl" x="255" y="161" text-anchor="middle">JSON</text>
          <line class="ln-acc" x1="320" y1="268" x2="222" y2="268" marker-end="url(#a2)"/>
          <text class="lbl-acc" x="255" y="261" text-anchor="middle">SSE words</text>

          <!-- Inside FastAPI -->
          <line class="ln" x1="415" y1="192" x2="415" y2="240" marker-end="url(#a1)"/>
          <text class="lbl" x="424" y="220">start stream</text>
          <line class="ln" x1="400" y1="296" x2="400" y2="340" marker-end="url(#a1)"/>
          <text class="lbl" x="392" y="322" text-anchor="end">prompt</text>
          <line class="ln-acc" x1="430" y1="340" x2="430" y2="296" marker-end="url(#a2)"/>
          <text class="lbl-acc" x="438" y="322">deltas</text>
          <line class="ln" x1="510" y1="170" x2="560" y2="204" marker-start="url(#a1)" marker-end="url(#a1)"/>
          <line class="ln" x1="510" y1="262" x2="560" y2="228" marker-end="url(#a1)"/>
          <text class="lbl" x="516" y="286">save on done</text>

          <!-- FastAPI <-> outside -->
          <line class="ln" x1="710" y1="214" x2="800" y2="214" marker-start="url(#a1)" marker-end="url(#a1)"/>
          <text class="lbl" x="755" y="207" text-anchor="middle">read/write</text>
          <line class="ln-later" x1="710" y1="200" x2="800" y2="142" marker-end="url(#a3)"/>
          <line class="ln" x1="510" y1="356" x2="800" y2="356" marker-end="url(#a1)"/>
          <text class="lbl" x="655" y="349" text-anchor="middle">acompletion(stream=True)</text>
          <line class="ln-acc" x1="800" y1="376" x2="512" y2="376" marker-end="url(#a2)"/>
          <text class="lbl-acc" x="655" y="394" text-anchor="middle">token chunks</text>
          <path class="ln-later" d="M415,388 V434 H800" marker-end="url(#a3)"/>
          <text class="lbl-later" x="655" y="427" text-anchor="middle">callback · later</text>
        </svg>
